<!doctype html>

<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Layanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--utama:#16a34a;--merah:#dc2626;--kuning:#d97706;--latar:#0b1210;--panel:#121c19;--garis:#1f2d29;--teks:#e6efe9;--redup:#8aa39a;--r:14px;font-family:"Space Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--latar);color:var(--teks)}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 40px}
.proto{background:#2a2410;color:#fcd34d;border:1px solid #574a17;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:30px;letter-spacing:-.02em}.sub{color:var(--redup);font-size:14px;margin-top:4px}
.ringkas{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:16px 18px;margin-bottom:18px;font-weight:600;font-size:18px}
.titik{width:14px;height:14px;border-radius:50%;background:var(--utama);box-shadow:0 0 0 0 color-mix(in srgb,var(--utama) 60%,transparent);animation:denyut 2s infinite}
.titik.turun{background:var(--merah);box-shadow:0 0 0 0 color-mix(in srgb,var(--merah) 60%,transparent)}
@keyframes denyut{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.kartu{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;animation:naik .4s both}
@keyframes naik{from{opacity:0;transform:translateY(8px)}}
.baris{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.nama{font-weight:700;font-size:17px}.url{font:12px "JetBrains Mono",monospace;color:var(--redup);word-break:break-all}
.lencana{font:600 12px "JetBrains Mono",monospace;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--utama) 18%,transparent);color:#4ade80}
.lencana.turun{background:color-mix(in srgb,var(--merah) 20%,transparent);color:#f87171}
.angka{display:flex;gap:18px;font:13px "JetBrains Mono",monospace;color:var(--redup);margin:10px 0 8px}.angka b{color:var(--teks)}
.bar{display:flex;gap:2px;height:26px;margin-top:6px}.bar i{flex:1;border-radius:2px;background:var(--utama)}.bar i.t{background:var(--merah)}.bar i.s{background:var(--kuning)}.bar i.k{background:var(--garis)}
svg.grafik{width:100%;height:70px;display:block;margin-top:10px}
.ket{display:flex;justify-content:space-between;font-size:11px;color:var(--redup);margin-top:4px}
footer{color:var(--redup);font-size:12px;text-align:center;margin-top:26px}footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="proto" role="note"><b>Prototipe:</b> data diperbarui oleh GitHub Actions tiap ±10 menit, bukan real-time. Browser tidak bisa mengecek situs lain langsung (diblok CORS), jadi halaman ini hanya membaca <code>data/status.json</code>.</div>
  <header><div><h1>Status Layanan</h1><div class="sub" id="diperbarui">Memuat…</div></div></header>
  <div class="ringkas" id="ringkas"><span class="titik"></span><span>Memuat status…</span></div>
  <div id="daftar"></div>
  <footer><p class="kredit-maliki">Template oleh <a href="https://malikisaputra.biz.id" target="_blank" rel="noopener">@malikisaputra</a></p></footer>
</div>
<script src="app.js"></script>
</body>
</html>
