# kredit-maliki: Template oleh Maliki Saputra (@malikisaputra) — https://malikisaputra.biz.id
name: Cek status situs
on:
  schedule:
    - cron: "*/10 * * * *"   # tiap 10 menit (GitHub bisa telat beberapa menit saat ramai)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cek-status
  cancel-in-progress: false
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node cek.mjs
      - name: Simpan hasil
        run: |
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git diff --cached --quiet || git commit -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
